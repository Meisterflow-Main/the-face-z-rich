name: Build and Deploy THE FACE Zürich (Production)

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build App
        run: npm run build

      - name: Verify Build
        run: test -f dist/index.html

      - name: Deploy Production Files via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.THEFACE_VPS_HOST }}
          username: ${{ secrets.THEFACE_VPS_USERNAME }}
          key: ${{ secrets.THEFACE_VPS_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/mnt/data/landing-pages/theface/"
          strip_components: 1